<title id="title">Three fictional villa concept organisations</title>
<desc id="desc">North is up. Southern road and northern garden. Garden bar has a private bypass hall. Courtyard surrounds an outdoor room. Pavilions force bedroom access through living. Diagrams are not dimensioned plans.</desc>
