<text x="40" y="526">Separate sleep route; lintel and shade unresolved.</text>
<text x="430" y="526">Sheltered court; more envelope and junctions.</text>
<text x="820" y="526">Sleep route crosses living; glare and span open.</text>
<text x="35" y="568">Green routes preserve the pilot's privacy intent. Red route fails it. Structure and comfort still need coordinated drawings and assessment.</text>
