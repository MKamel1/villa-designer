# The end-to-end test room: one bedroom, specified here and built in Revit.
#
# Chosen to exercise rules rather than to be pretty. 4200 x 3600 mm makes
# the double bed's 750 mm access on BOTH sides (Neufert) and the wardrobe's
# 750 mm door swing genuinely tight, so the clearance checks are real
# checks rather than formalities.
#
# Positions are the centre of each piece, in millimetres, measured from the
# room's inside south-west corner. The room's internal rectangle is
# (0,0) to (width, depth); wall centrelines sit half a wall thickness
# outside it.
#
# This file is the human surface. `scripts/make_bedroom_spec.py` converts
# it to JSON for the Revit side, because the builder runs in IronPython
# 2.7 inside Revit where PyYAML is not available.

name: Bedroom 01
level: Ground

room:
  width: 4200          # internal, mm (x)
  depth: 3600          # internal, mm (y)
  ceiling_height: 2700
  wall_thickness: 200
  occupancy: bedroom

# Wall ids are compass points so openings can name their host readably.
openings:
  - id: WD-01
    kind: window
    host: south
    at: 2100           # along the wall from the room's SW corner
    width: 1500
    height: 1400
    sill: 900
  - id: DR-01
    kind: door
    host: east
    at: 800
    width: 900
    height: 2100
    sill: 0

# Furniture. `family` names a real .rfa where we have one; where we do not,
# `proxy: true` builds a DirectShape box at the catalogue dimensions --
# correctly categorised and named PROXY so it can never be mistaken for a
# design proposal.
furniture:
  # ROTATED 180 after FURN-02 reported "0 mm clear to its front where 750
  # is needed -- a wall is in the way". The catalogue wants back = 0 (a
  # headboard may touch a wall) and front = 750 (the foot needs access),
  # so at rotation 0 the FOOT was against the north wall. Neufert also
  # wants 750 to BOTH long sides. Shifted 150 mm east to leave exactly
  # 750 between its west edge and the wardrobe's front.
  - id: FN-BED
    type: bed_double
    at: [2250, 2600]
    size: [1600, 2000]
    height: 600
    rotation: 180
    proxy: true
  - id: FN-BST-L
    type: bedside_table
    at: [1125, 3300]
    size: [450, 400]
    height: 500
    accessory_to: FN-BED
    rotation: 0
    proxy: true
  - id: FN-BST-R
    type: bedside_table
    at: [3375, 3300]
    size: [450, 400]
    height: 500
    accessory_to: FN-BED
    rotation: 0
    proxy: true
  # ROTATED after FURN-02 reported "100 mm clear to its front where 750 is
  # needed -- a wall is in the way". At 90 the doors opened INTO the west
  # wall. 270 turns the front to face the room.
  - id: FN-WRD
    type: wardrobe
    at: [400, 2300]
    size: [1200, 600]
    height: 2100
    rotation: 270
    proxy: true
  # Moved clear of the east door and the bed-foot access zone. Measured
  # geometry (including the real chair's offset centre) governs checks.
  # The wardrobe also moved north so it does not obstruct the chair zone.
  - id: FN-DSK
    type: desk
    at: [1050, 400]
    size: [1200, 600]
    height: 750
    rotation: 0
    proxy: true
  - id: FN-CHR
    type: chair
    at: [1050, 1060]
    size: [500, 500]
    accessory_to: FN-DSK
    rotation: 180
    family: chair_cafe_wood_metal_9045_bimlibrary.co_.rfa

# Three deliberate layers, so the "no lone central fixture" rule passes and
# its negative case can be tested by deleting layers. Positions now follow
# the corrected Revit layout, not the historical mock's fixed coordinates.
lighting:
  - id: LT-01
    layer: ambient
    at: [2100, 1800]
    mounting_height: 2400
    host: ceiling
    ies: PLD1A21.ies
    lumens: 2780
    watts: 29.3          # LED equivalent; the IES files are
                          # 1990s incandescent/T12 and their
                          # wattage describes a lamp nobody
                          # would specify (ADR-0010)
    kelvin: 2700
    family: pendant_cone_16inch_106_bimlibrary.co_.rfa
  # SUBSTITUTION, recorded rather than hidden: the spec wants wall-mounted
  # bedside reading lights, and no wall-hostable luminaire was available in
  # the downloaded set -- every one is ceiling-based. These are therefore
  # bedside PENDANTS, dropped to 1200 mm on a host offset. A legitimate
  # design choice, but not the one originally written, and the photometry
  # (EWL2A19, a lamphead) still describes the intended fitting.
  # MOVED after the report measured 114 lx at the pillow against a
  # 300-500 lx reading band. A 17-degree beam at 1200 mm lights the
  # bedside TABLE, not the book: 600 mm away and 300 mm up is 63 degrees
  # off the beam axis. Now over the pillow and raised to 2000 mm, which
  # also clears the point-source limit (1100 mm against a 600 mm minimum).
  - id: LT-02
    layer: task
    at: [1725, 3300]
    mounting_height: 2000
    host: ceiling
    ies: EWL2A19.ies
    lumens: 780
    watts: 8.2
    kelvin: 2700
    family: pendant_cylinder_simple_136_bimlibrary.co_.rfa
  - id: LT-03
    layer: task
    at: [2775, 3300]
    mounting_height: 2000
    host: ceiling
    ies: EWL2A19.ies
    lumens: 780
    watts: 8.2
    kelvin: 2700
    family: pendant_cylinder_simple_136_bimlibrary.co_.rfa
  - id: LT-04
    layer: accent
    at: [400, 2300]
    mounting_height: 2400
    host: ceiling
    ies: LGLled.ies
    lumens: 1008
    watts: 10.6
    kelvin: 3000
    family: linear_ceiling_mount_parametric_111_bimlibrary.co_.rfa

  # ADDED after the first lighting report measured 4 lx on the desk top.
  # The three-layer scheme lit the bed and the wardrobe and left the work
  # surface dark. A task light is the cheapest fix and does not disturb the
  # rest of the layout (loop L11: lighting -> lighting).
  - id: LT-05
    layer: task
    at: [1050, 400]
    mounting_height: 2300
    host: ceiling
    ies: LGLled.ies
    lumens: 1008
    watts: 10.6
    kelvin: 3000
    family: pendant_cylinder_simple_136_bimlibrary.co_.rfa

materials:
  walls: painted
  floor: timber
  ceiling: plaster
